name: Build — Reusable steps

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      dotnet_version:
        required: false
        type: string
        default: "10.0.x"
      solution:
        required: false
        type: string
        default: "IntegrationHub.slnx"
      configuration:
        required: false
        type: string
        default: "Release"
      publish_project:
        required: false
        type: string
        default: "src/IntegrationHub.Functions/IntegrationHub.Functions.csproj"
      functions_artifact_name:
        required: false
        type: string
        default: "functions-build"
      artifact_retention_days:
        required: false
        type: number
        default: 14
      enforce_coverage:
        required: false
        type: boolean
        default: false
      coverage_threshold:
        required: false
        type: number
        default: 60

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET ${{ inputs.dotnet_version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.solution }}

      - name: Build (${{ inputs.configuration }})
        run: dotnet build ${{ inputs.solution }} --no-restore --configuration ${{ inputs.configuration }}

      - name: Run unit tests
        run: |
          dotnet test ${{ inputs.solution }} \
            --no-build \
            --configuration ${{ inputs.configuration }} \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"

      - name: Run coverage gate
        if: ${{ inputs.enforce_coverage }}
        run: |
          dotnet test ${{ inputs.solution }} \
            --no-build \
            --configuration ${{ inputs.configuration }} \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:Threshold=${{ inputs.coverage_threshold }} \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Publish Function App
        run: |
          dotnet publish \
            ${{ inputs.publish_project }} \
            --no-restore \
            --configuration ${{ inputs.configuration }} \
            --output ./publish/functions

      - name: Upload Function App artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.functions_artifact_name }}
          path: ./publish/functions
          retention-days: ${{ inputs.artifact_retention_days }}
          include-hidden-files: true